<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Exit - Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="dashboard-header">
    <div class="container flex flex-between flex-center">
        <div>
            <h1 style="font-size: 24px; margin-bottom: 0;">RECORD EXIT</h1>
        </div>
        <div class="flex gap-4">
            <a href="security-dashboard.html" class="btn btn-secondary btn-sm">Back to Dashboard</a>
            <a href="login.html" class="btn btn-primary btn-sm">LOGOUT</a>
        </div>
    </div>
</div>

<div class="dashboard-content">
    <div class="container">
        <div style="margin-bottom: 32px;">
            <h2 style="margin-bottom: 8px;">Record Visitor Exit</h2>
            <p>Mark visitor exit time and update status.</p>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div id="successMessage" class="success-message" style="display: none;"></div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <form id="exitForm">
                <div class="form-group">
                    <label for="passId">Pass ID *</label>
                    <input type="text" id="passId" name="passId" required placeholder="Enter pass ID (e.g., PASS12345)">
                </div>

                <div class="form-group">
                    <label for="exitNotes">Exit Notes</label>
                    <textarea id="exitNotes" name="exitNotes" rows="3" placeholder="Add any notes about the exit (optional)"></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">RECORD EXIT</button>
            </form>
        </div>

        <div class="card" id="visitorInfo" style="display: none; margin-top: 32px;">
            <h3 style="margin-bottom: 24px;">Visitor Information</h3>
            
            <div class="info-row">
                <span class="info-label">Visitor Name</span>
                <span class="info-value" id="infoVisitorName">John Doe</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Pass ID</span>
                <span class="info-value" id="infoPassId">PASS12345</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Entry Time</span>
                <span class="info-value" id="infoEntryTime">10:30 AM</span>
            </div>
            
            <div class="info-row">
                <span class="info-label">Current Status</span>
                <span class="status-badge status-inside" id="infoStatus">INSIDE</span>
            </div>

            <div class="divider"></div>

            <button class="btn btn-primary btn-block" onclick="confirmExit()">CONFIRM EXIT</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('exitForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const passId = document.getElementById('passId').value;
        const notes = document.getElementById('exitNotes').value;
        
        // TODO: Call backend to fetch visitor info
        // Simulate visitor found
        document.getElementById('visitorInfo').style.display = 'block';
        document.getElementById('infoPassId').textContent = passId;
    });

    function confirmExit() {
        alert('Exit recorded successfully! Visitor status updated to EXITED.');
        window.location.href = 'security-dashboard.html';
    }
</script>

</body>
</html>
