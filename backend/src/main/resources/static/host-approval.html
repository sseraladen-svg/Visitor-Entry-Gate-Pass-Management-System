<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Approval - Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="dashboard-header">
    <div class="flex flex-between">
        <h1>HOST_APPROVAL</h1>
        <a href="admin-dashboard.html" class="link">← DASHBOARD</a>
    </div>
</div>

<div class="dashboard-content">
    <div class="bento-card" style="margin-bottom: 24px;">
        <h2>PENDING_APPROVALS</h2>
        <p class="mono" style="color: var(--text-secondary);">Review and approve visitor appointment requests</p>
    </div>

    <div class="bento-card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>VISITOR</th>
                    <th>PURPOSE</th>
                    <th>DATE/TIME</th>
                    <th>STATUS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody id="appointmentList">
                <tr>
                    <td colspan="5" class="mono" style="text-align: center; color: var(--text-secondary);">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadAppointments() {
        try {
            const response = await fetch('/api/appointments');
            if (response.ok) {
                const appointments = await response.json();
                const tbody = document.getElementById('appointmentList');
                
                if (appointments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="mono" style="text-align: center; color: var(--text-secondary);">No pending appointments</td></tr>';
                    return;
                }

                tbody.innerHTML = appointments.map(apt => `
                    <tr>
                        <td>
                            <div style="font-weight: 600;">${apt.visitorName}</div>
                            <div class="mono" style="font-size: 12px; color: var(--text-secondary);">${apt.visitorEmail}</div>
                        </td>
                        <td>${apt.purpose}</td>
                        <td class="mono">${apt.appointmentDate} ${apt.appointmentTime}</td>
                        <td><span class="status-badge status-${apt.status.toLowerCase()}">${apt.status}</span></td>
                        <td>
                            <div class="flex gap-2">
                                <button class="btn btn-primary btn-sm" onclick="approveAppointment(${apt.id})">APPROVE</button>
                                <button class="btn btn-danger btn-sm" onclick="rejectAppointment(${apt.id})">REJECT</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error('Failed to load appointments:', error);
            document.getElementById('appointmentList').innerHTML = '<tr><td colspan="5" class="mono" style="text-align: center; color: var(--neon-red);">Failed to load data</td></tr>';
        }
    }

    async function approveAppointment(id) {
        if (confirm('Approve this appointment?')) {
            try {
                const response = await fetch('/api/approve-appointment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appointmentId: id })
                });
                if (response.ok) {
                    alert('Appointment approved!');
                    loadAppointments();
                } else {
                    alert('Failed to approve appointment');
                }
            } catch (error) {
                console.error('Error approving appointment:', error);
                alert('Error approving appointment');
            }
        }
    }

    async function rejectAppointment(id) {
        const reason = prompt('Enter rejection reason:');
        if (reason) {
            try {
                const response = await fetch('/api/reject-appointment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ appointmentId: id, reason: reason })
                });
                if (response.ok) {
                    alert('Appointment rejected!');
                    loadAppointments();
                } else {
                    alert('Failed to reject appointment');
                }
            } catch (error) {
                console.error('Error rejecting appointment:', error);
                alert('Error rejecting appointment');
            }
        }
    }

    loadAppointments();
    setInterval(loadAppointments, 30000); // Refresh every 30 seconds
</script>

</body>
</html>
