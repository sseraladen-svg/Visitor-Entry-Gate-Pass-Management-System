<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Verification</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-header">
        <div class="flex flex-between">
            <h1>QR_VERIFICATION</h1>
            <a href="security-dashboard.html" class="link">← BACK</a>
        </div>
    </div>

    <div class="dashboard-content">
        <div class="bento-card" style="margin-bottom: 24px;">
            <h2>SCAN_QR_CODE</h2>
            <p class="mono" style="color: var(--text-secondary);">Scan visitor QR code for verification</p>
        </div>

        <div class="bento-card" style="margin-bottom: 24px;">
            <div class="form-group">
                <label class="mono">ENTER_PASS_ID</label>
                <input type="text" id="passId" placeholder="Enter pass ID manually">
            </div>
            <button onclick="verifyPass()" class="btn btn-primary btn-block">VERIFY</button>
        </div>

        <div class="bento-card" id="verificationResult" style="display: none;">
            <h3>VERIFICATION_RESULT</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        async function verifyPass() {
            const passId = document.getElementById('passId').value;
            if (!passId) {
                alert('Please enter a pass ID');
                return;
            }

            try {
                const response = await fetch('/api/gate-passes');
                if (response.ok) {
                    const gatePasses = await response.json();
                    const gatePass = gatePasses.find(gp => gp.passId === passId);
                    
                    const resultDiv = document.getElementById('verificationResult');
                    const resultContent = document.getElementById('resultContent');
                    resultDiv.style.display = 'block';
                    
                    if (gatePass) {
                        resultContent.innerHTML = `
                            <div class="info-row">
                                <span class="info-label">NAME</span>
                                <span class="info-value mono">${gatePass.visitorName}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">EMAIL</span>
                                <span class="info-value mono">${gatePass.visitorEmail}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">HOST</span>
                                <span class="info-value mono">${gatePass.hostName}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">PURPOSE</span>
                                <span class="info-value mono">${gatePass.purpose}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">STATUS</span>
                                <span class="status-badge status-${gatePass.status.toLowerCase()}">${gatePass.status}</span>
                            </div>
                            <div style="margin-top: 16px;">
                                <button onclick="allowEntry('${gatePass.passId}')" class="btn btn-primary btn-block">ALLOW_ENTRY</button>
                            </div>
                        `;
                    } else {
                        resultContent.innerHTML = '<p class="mono" style="color: var(--neon-red);">Pass not found</p>';
                    }
                }
            } catch (error) {
                console.error('Verification error:', error);
                alert('Failed to verify pass');
            }
        }

        async function allowEntry(passId) {
            try {
                const response = await fetch('/record-entry', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ passId: passId, notes: 'QR verified' })
                });
                if (response.ok) {
                    alert('Entry recorded successfully');
                    window.location.href = 'security-dashboard.html';
                }
            } catch (error) {
                console.error('Entry error:', error);
                alert('Failed to record entry');
            }
        }
    </script>
</body>
</html>
