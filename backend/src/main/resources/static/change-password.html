<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-centered">

<div class="card card-lg login-card">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 28px; margin-bottom: 8px;">VISITOR GATE PASS</h1>
        <h2 style="font-size: 24px; color: var(--grey-600); margin-bottom: 0;">MANAGEMENT SYSTEM</h2>
    </div>

    <div class="divider-sm"></div>

    <h3 style="text-align: center; margin-bottom: 24px;">Change Password</h3>

    <div id="successMessage" class="success-message" style="display: none;"></div>
    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <form id="changePasswordForm">
        <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <div class="password-group">
                <input type="password" id="currentPassword" name="currentPassword" required placeholder="Enter your current password">
                <button type="button" class="password-toggle" onclick="togglePassword('currentPassword', this)">👁</button>
            </div>
        </div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <div class="password-group">
                <input type="password" id="newPassword" name="newPassword" required placeholder="Enter your new password">
                <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)">👁</button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <div class="password-group">
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your new password">
                <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">👁</button>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">CHANGE PASSWORD</button>
    </form>

    <div class="section-separator">
        <a href="visitor-dashboard.html" class="btn btn-secondary btn-block btn-lg">BACK TO DASHBOARD</a>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🔒';
        } else {
            input.type = 'password';
            button.textContent = '👁';
        }
    }

    document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const currentPassword = document.getElementById('currentPassword').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        const successDiv = document.getElementById('successMessage');
        const errorDiv = document.getElementById('errorMessage');

        // Validate passwords
        if (newPassword !== confirmPassword) {
            errorDiv.textContent = 'New password and confirm password do not match.';
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
            return;
        }

        if (newPassword.length < 8) {
            errorDiv.textContent = 'Password must be at least 8 characters long.';
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
            return;
        }

        // TODO: Replace with actual API call
        // For now, simulate password change
        if (currentPassword && newPassword) {
            // Simulate successful password change
            successDiv.textContent = 'Password changed successfully! You can now use your new password to login.';
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            
            // Clear form
            document.getElementById('changePasswordForm').reset();
        } else {
            errorDiv.textContent = 'Please fill in all fields.';
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
