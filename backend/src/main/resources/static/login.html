<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
            border: 2px solid var(--primary-black);
            border-radius: 8px;
            overflow: hidden;
        }

        .login-tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            background: var(--grey-100);
            border: none;
            transition: all 0.3s ease;
        }

        .login-tab.active {
            background: var(--primary-black);
            color: var(--primary-white);
        }

        .login-tab:hover:not(.active) {
            background: var(--grey-200);
        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
        }
    </style>
</head>
<body class="page-centered">

<div class="card card-lg login-card">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 28px; margin-bottom: 8px;">VISITOR GATE PASS</h1>
        <h2 style="font-size: 24px; color: var(--grey-600); margin-bottom: 0;">MANAGEMENT SYSTEM</h2>
    </div>

    <div class="divider-sm"></div>

    <div class="login-tabs">
        <button class="login-tab active" onclick="showTab('security')">SECURITY</button>
        <button class="login-tab" onclick="showTab('admin')">ADMIN</button>
    </div>

    <!-- Security Login Form -->
    <div id="securityForm" class="login-form active">
        <div id="securityErrorMessage" class="error-message" style="display: none;"></div>

        <form id="securityLoginForm" action="/security-login" method="post">
            <div class="form-group">
                <label for="securityId">Security ID / Email</label>
                <input type="text" id="securityId" name="securityId" required placeholder="Enter your security ID or email">
            </div>

            <div class="form-group">
                <label for="securityPassword">Password</label>
                <div class="password-group">
                    <input type="password" id="securityPassword" name="password" required placeholder="Enter your password">
                    <button type="button" class="password-toggle" onclick="togglePassword('securityPassword', this)">👁</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <a href="forgot-password.html" class="link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">LOGIN</button>
        </form>
    </div>

    <!-- Admin Login Form -->
    <div id="adminForm" class="login-form">
        <div id="adminErrorMessage" class="error-message" style="display: none;"></div>

        <form id="adminLoginForm" action="/admin-login" method="post">
            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <input type="email" id="adminEmail" name="email" required placeholder="Enter your admin email">
            </div>

            <div class="form-group">
                <label for="adminPassword">Password</label>
                <div class="password-group">
                    <input type="password" id="adminPassword" name="password" required placeholder="Enter your password">
                    <button type="button" class="password-toggle" onclick="togglePassword('adminPassword', this)">👁</button>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <a href="forgot-password.html" class="link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">LOGIN</button>
        </form>
    </div>

    <div class="section-separator">
        <p style="text-align: center; color: var(--grey-600); margin-bottom: 16px;">Forgot your password?</p>
        <a href="forgot-password.html" class="btn btn-secondary btn-block btn-lg">RESET PASSWORD</a>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.textContent = '🔒';
        } else {
            input.type = 'password';
            button.textContent = '👁';
        }
    }

    function showTab(tab) {
        // Hide all forms
        document.getElementById('securityForm').classList.remove('active');
        document.getElementById('adminForm').classList.remove('active');
        
        // Remove active class from all tabs
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        
        // Show selected form and activate tab
        if (tab === 'security') {
            document.getElementById('securityForm').classList.add('active');
            document.querySelectorAll('.login-tab')[0].classList.add('active');
        } else {
            document.getElementById('adminForm').classList.add('active');
            document.querySelectorAll('.login-tab')[1].classList.add('active');
        }
    }

    document.getElementById('securityLoginForm').addEventListener('submit', function(e) {
        const securityId = document.getElementById('securityId').value;
        const password = document.getElementById('securityPassword').value;
        const errorDiv = document.getElementById('securityErrorMessage');
        
        if (!securityId || !password) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter both security ID and password.';
            errorDiv.style.display = 'block';
        }
        // If valid, let the form submit to backend
    });

    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        const errorDiv = document.getElementById('adminErrorMessage');
        
        if (!email || !password) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter both email and password.';
            errorDiv.style.display = 'block';
        }
        // If valid, let the form submit to backend
    });

    // Check for error in URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'true') {
        const errorDiv = document.getElementById('visitorErrorMessage');
        errorDiv.textContent = urlParams.get('message') || 'Invalid email or password. Please try again.';
        errorDiv.style.display = 'block';
    }
</script>

</body>
</html>
