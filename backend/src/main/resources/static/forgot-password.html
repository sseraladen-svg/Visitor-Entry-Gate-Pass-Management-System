<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-centered">

<div class="card card-lg login-card">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 28px; margin-bottom: 8px;">VISITOR GATE PASS</h1>
        <h2 style="font-size: 24px; color: var(--grey-600); margin-bottom: 0;">MANAGEMENT SYSTEM</h2>
    </div>

    <div class="divider-sm"></div>

    <h3 style="text-align: center; margin-bottom: 24px;">Forgot Password</h3>

    <p style="text-align: center; margin-bottom: 24px;">Enter your email address and we'll send you a link to reset your password.</p>

    <div id="successMessage" class="success-message" style="display: none;"></div>
    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <form id="forgotPasswordForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">SEND RESET LINK</button>
    </form>

    <div class="section-separator">
        <p style="text-align: center; color: var(--grey-600); margin-bottom: 16px;">Remember your password?</p>
        <a href="login.html" class="btn btn-secondary btn-block btn-lg">BACK TO LOGIN</a>
    </div>
</div>

<script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const successDiv = document.getElementById('successMessage');
        const errorDiv = document.getElementById('errorMessage');

        // TODO: Replace with actual API call
        // For now, simulate password reset
        if (email) {
            // Simulate successful password reset request
            successDiv.textContent = 'Password reset link has been sent to your email address. Please check your inbox and follow the instructions to reset your password.';
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            
            // Clear form
            document.getElementById('forgotPasswordForm').reset();
        } else {
            errorDiv.textContent = 'Please enter your email address.';
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
