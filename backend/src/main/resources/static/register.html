<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Registration - Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-centered">

<div class="bento-card" style="max-width: 800px; width: 100%;">
    <div style="text-align: center; margin-bottom: 32px;">
        <h1 style="font-size: 28px; margin-bottom: 8px;">VISITOR_GATE_PASS</h1>
        <h2 style="font-size: 24px; color: var(--text-secondary); font-weight: 400; margin-bottom: 0;">MANAGEMENT_SYSTEM</h2>
    </div>

    <h3 style="text-align: center; margin-bottom: 24px;">VISITOR_REGISTRATION</h3>

    <div id="successMessage" class="bento-card" style="background: rgba(63, 185, 80, 0.1); border-color: var(--neon-green); display: none; margin-bottom: 24px;">
        <p class="mono" style="color: var(--neon-green);">Registration successful! Please login to continue.</p>
    </div>
    <div id="errorMessage" class="bento-card" style="background: rgba(248, 81, 73, 0.1); border-color: var(--neon-red); display: none; margin-bottom: 24px;">
        <p class="mono" style="color: var(--neon-red);">Registration failed. Please try again.</p>
    </div>

    <form id="registrationForm">
        <div class="form-group">
            <label class="mono">FULL_NAME</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label class="mono">EMAIL_ADDRESS</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address">
        </div>

        <div class="form-group">
            <label class="mono">PHONE_NUMBER</label>
            <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
        </div>

        <div class="form-group">
            <label class="mono">PASSWORD</label>
            <input type="password" id="password" name="password" required placeholder="Create a password">
        </div>

        <div class="form-group">
            <label class="mono">COMPANY_NAME</label>
            <input type="text" id="company" name="company" required placeholder="Enter your company name">
        </div>

        <div class="form-group">
            <label class="mono">DEPARTMENT</label>
            <input type="text" id="department" name="department" placeholder="Enter your department (optional)">
        </div>

        <div class="form-group">
            <label class="mono">ID_PROOF_TYPE</label>
            <select id="idProofType" name="idProofType">
                <option value="">Select ID Proof</option>
                <option value="PASSPORT">Passport</option>
                <option value="DRIVING_LICENSE">Driving License</option>
                <option value="AADHAAR">Aadhaar Card</option>
                <option value="PAN">PAN Card</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label class="mono">ID_PROOF_NUMBER</label>
            <input type="text" id="idProofNumber" name="idProofNumber" placeholder="Enter ID proof number">
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">REGISTER</button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-color);">
        <p class="mono" style="color: var(--text-secondary); margin-bottom: 16px;">ALREADY_REGISTERED?</p>
        <a href="login.html" class="btn btn-secondary btn-block">LOGIN</a>
    </div>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const data = Object.fromEntries(formData);

        const successDiv = document.getElementById('successMessage');
        const errorDiv = document.getElementById('errorMessage');

        try {
            const response = await fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(data)
            });

            if (response.ok || response.redirected) {
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                document.getElementById('registrationForm').reset();
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                throw new Error('Registration failed');
            }
        } catch (error) {
            console.error('Registration error:', error);
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
