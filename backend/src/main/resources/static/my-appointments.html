<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="dashboard-header">
    <div class="flex flex-between">
        <h1>MY_APPOINTMENTS</h1>
        <a href="index.html" class="link">← HOME</a>
    </div>
</div>

<div class="dashboard-content">
    <div class="bento-card" style="margin-bottom: 24px;">
        <h2>SEARCH_APPOINTMENTS</h2>
        <p class="mono" style="color: var(--text-secondary);">Enter your email to view your appointments</p>
        
        <div style="margin-top: 16px;">
            <div class="form-group">
                <label class="mono">YOUR_EMAIL</label>
                <input type="email" id="searchEmail" placeholder="Enter your email address">
            </div>
            <button onclick="searchAppointments()" class="btn btn-primary btn-block">SEARCH</button>
        </div>
    </div>

    <div class="bento-card">
        <h2>APPOINTMENT_LIST</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>DATE</th>
                    <th>TIME</th>
                    <th>HOST</th>
                    <th>PURPOSE</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody id="appointmentList">
                <tr>
                    <td colspan="5" class="mono" style="text-align: center; color: var(--text-secondary);">Enter your email to search appointments</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function searchAppointments() {
        const email = document.getElementById('searchEmail').value;
        if (!email) {
            alert('Please enter your email address');
            return;
        }

        try {
            const response = await fetch('/api/appointments');
            if (response.ok) {
                const allAppointments = await response.json();
                const myAppointments = allAppointments.filter(apt => apt.visitorEmail === email);
                
                const tbody = document.getElementById('appointmentList');
                
                if (myAppointments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="mono" style="text-align: center; color: var(--text-secondary);">No appointments found for this email</td></tr>';
                    return;
                }

                tbody.innerHTML = myAppointments.map(apt => `
                    <tr>
                        <td class="mono">${apt.appointmentDate}</td>
                        <td class="mono">${apt.appointmentTime}</td>
                        <td>${apt.hostName}</td>
                        <td>${apt.purpose}</td>
                        <td><span class="status-badge status-${apt.status.toLowerCase()}">${apt.status}</span></td>
                    </tr>
                `).join('');
            }
        } catch (error) {
            console.error('Failed to load appointments:', error);
            document.getElementById('appointmentList').innerHTML = '<tr><td colspan="5" class="mono" style="text-align: center; color: var(--neon-red);">Failed to load data</td></tr>';
        }
    }
</script>

</body>
</html>
