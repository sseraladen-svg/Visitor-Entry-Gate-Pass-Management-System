<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Gate Pass Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-centered">

<div class="bento-card" style="max-width: 900px; width: 100%;">
    <div style="text-align: center; margin-bottom: 40px;">
        <h1 class="mono" style="font-size: 14px; color: var(--neon-green); margin-bottom: 16px;">SYSTEM_READY</h1>
        <h1 style="font-size: 42px; margin-bottom: 8px;">VISITOR_GATE_PASS</h1>
        <h2 style="font-size: 28px; color: var(--text-secondary); font-weight: 400;">MANAGEMENT_SYSTEM</h2>
    </div>

    <div class="bento-grid" style="margin-bottom: 32px;">
        <div class="bento-card">
            <h3 class="mono">001</h3>
            <div class="stat-number mono" style="color: var(--neon-green)">SECURE</div>
            <div class="stat-label">AUTHENTICATION</div>
        </div>
        <div class="bento-card">
            <h3 class="mono">002</h3>
            <div class="stat-number mono" style="color: var(--neon-blue)">DIGITAL</div>
            <div class="stat-label">PASS_MANAGEMENT</div>
        </div>
        <div class="bento-card">
            <h3 class="mono">003</h3>
            <div class="stat-number mono" style="color: var(--neon-red)">REAL-TIME</div>
            <div class="stat-label">VERIFICATION</div>
        </div>
    </div>

    <div class="bento-grid">
        <div class="action-card" onclick="window.location.href='login.html'">
            <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
            <h4>LOGIN</h4>
            <p class="mono">ACCESS_ACCOUNT</p>
        </div>
        
        <div class="action-card" onclick="window.location.href='register.html'">
            <div style="font-size: 48px; margin-bottom: 16px;">📝</div>
            <h4>REGISTER</h4>
            <p class="mono">NEW_VISITOR</p>
        </div>

        <div class="action-card" onclick="window.location.href='appointment.html'">
            <div style="font-size: 48px; margin-bottom: 16px;">📅</div>
            <h4>APPOINTMENT</h4>
            <p class="mono">SCHEDULE_VISIT</p>
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border-color);">
        <p class="mono" style="color: var(--text-secondary); font-size: 12px;">© 2026 VISION_GATE_SYSTEM</p>
    </div>
</div>

</body>
</html>
