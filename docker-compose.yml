version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: visitor-gate-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: visitor_gate_pass_system
      MYSQL_USER: gatepass_user
      MYSQL_PASSWORD: gatepass_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - visitor-gate-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: visitor-gate-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/visitor_gate_pass_system
      SPRING_DATASOURCE_USERNAME: gatepass_user
      SPRING_DATASOURCE_PASSWORD: gatepass_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - visitor-gate-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  visitor-gate-network:
    driver: bridge
